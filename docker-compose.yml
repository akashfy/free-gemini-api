services:
  free-gemini-api:
    build: .
    image: akashyadav758/free-gemini-api:custom
    container_name: free-gemini-api
    ports:
      - "8002:8001" # Fiber HTTP API (Changed host port to 8002 to avoid conflict)
      - "9226:9226" # WebSocket Cookie Bridge
    working_dir: /app/data
    command: /app/main
    volumes:
      - gemini-data:/app/data
      - /Users:/Users:ro
    restart: unless-stopped

volumes:
  gemini-data:
